name: CF03 native stack validation

on:
  push:
    branches:
      - phase/cf-03-native-stack
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cf03-native-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Native dependency audit
        run: |
          echo "Next imports in application source:"
          grep -RInE "from ['\"]next(/|['\"])|require\(['\"]next" src --include='*.ts' --include='*.tsx' || true
          echo "Prisma imports in application source:"
          grep -RInE "@prisma/client|@prisma/adapter-d1|@/lib/db" src --include='*.ts' --include='*.tsx' || true

      - name: Native TypeScript gate
        run: npm run native:typecheck

      - name: Native Vite Worker build
        run: npm run native:build
