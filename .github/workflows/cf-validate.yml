name: Validate Cloudflare runtime

on:
  push:
    branches:
      - phase/cf-01-runtime-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cf-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Apply D1 migrations locally
        run: bun run db:migrate:local

      - name: D1 schema smoke test
        run: |
          bunx wrangler d1 execute boardops --local --command 'SELECT COUNT(*) AS users FROM "User";'
          bunx wrangler d1 execute boardops --local --command 'SELECT COUNT(*) AS settings FROM "Setting";'
          bunx wrangler d1 execute boardops --local --command 'SELECT COUNT(*) AS meals FROM "MealConfiguration";'
          bunx wrangler d1 execute boardops --local --command 'SELECT COUNT(*) AS bills FROM "Bill";'

      - name: Regression tests
        run: bun run test

      - name: Production TypeScript gate
        run: bun run typecheck

      - name: Zero-warning ESLint gate
        run: bun run lint:strict

      - name: Check vinext compatibility
        run: bunx vinext check

      - name: Build Cloudflare production bundle
        run: bun run build
