name: Validate Cloudflare runtime

on:
  push:
    branches:
      - phase/cf-01-runtime-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cf-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies and generate npm lockfile
        run: npm install --no-audit --no-fund

      - name: Upload generated npm lockfile
        uses: actions/upload-artifact@v4
        with:
          name: npm-lockfile
          path: package-lock.json
          if-no-files-found: error

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply D1 migrations locally
        run: npm run db:migrate:local

      - name: D1 schema smoke test
        run: |
          npm exec -- wrangler d1 execute boardops --local --command 'SELECT COUNT(*) AS users FROM "User";'
          npm exec -- wrangler d1 execute boardops --local --command 'SELECT COUNT(*) AS settings FROM "Setting";'
          npm exec -- wrangler d1 execute boardops --local --command 'SELECT COUNT(*) AS meals FROM "MealConfiguration";'
          npm exec -- wrangler d1 execute boardops --local --command 'SELECT COUNT(*) AS bills FROM "Bill";'

      - name: Regression tests
        run: npm test

      - name: Production TypeScript gate
        run: npm run typecheck

      - name: Zero-warning ESLint gate
        run: npm run lint:strict

      - name: Check vinext compatibility
        run: npm run cf:check

      - name: Build Cloudflare production bundle
        run: npm run build
