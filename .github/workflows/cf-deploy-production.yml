name: Deploy BoardOps to Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boardops-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/phase/cf-01-runtime-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Regression tests
        run: npm test

      - name: Production TypeScript gate
        run: npm run typecheck

      - name: Zero-warning ESLint gate
        run: npm run lint:strict

      - name: Check vinext compatibility
        run: npm run cf:check

      - name: Build Cloudflare production bundle
        run: npm run build

      - name: Inject production D1 database ID
        env:
          D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          test -n "$D1_DATABASE_ID" || { echo "CLOUDFLARE_D1_DATABASE_ID is missing"; exit 1; }
          node --input-type=module -e '
            import { readFile, writeFile } from "node:fs/promises";
            const path = "wrangler.jsonc";
            const config = JSON.parse(await readFile(path, "utf8"));
            const db = config.d1_databases?.find((entry) => entry.binding === "DB");
            if (!db) throw new Error("DB binding not found");
            db.database_id = process.env.D1_DATABASE_ID;
            await writeFile(path, JSON.stringify(config, null, 2) + "\n", "utf8");
          '

      - name: Cloudflare deployment preflight
        run: npm run cf:preflight

      - name: Apply D1 migrations
        run: npm run db:migrate:remote

      - name: Deploy Worker
        run: npm run deploy

      - name: Production smoke test
        if: ${{ vars.BOARDOPS_PRODUCTION_URL != '' }}
        env:
          PRODUCTION_URL: ${{ vars.BOARDOPS_PRODUCTION_URL }}
        run: |
          set -euo pipefail
          base="${PRODUCTION_URL%/}"
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 20 "$base/api" | grep -q 'Hello, world!'; then
              echo "Production smoke test passed: $base/api"
              exit 0
            fi
            echo "Smoke test attempt $attempt failed; retrying..."
            sleep 5
          done
          echo "Production smoke test failed after 5 attempts"
          exit 1
