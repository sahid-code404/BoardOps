name: CF03 Drizzle schema normalization

on:
  push:
    branches:
      - phase/cf-03-native-stack
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cf03-drizzle-normalization
  cancel-in-progress: true

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare authoritative SQLite schema
        run: |
          command -v sqlite3 >/dev/null || { sudo apt-get update && sudo apt-get install -y sqlite3; }
          rm -f .cf03-introspect.sqlite
          sqlite3 .cf03-introspect.sqlite < migrations/0001_initial.sql

      - name: Install introspection-only SQLite driver
        run: npm install --no-save --no-package-lock better-sqlite3@^12.2.0 --no-audit --no-fund

      - name: Generate and normalize Drizzle mapping
        run: |
          cat > drizzle.cf03.introspect.config.ts <<'CONFIG'
          import { defineConfig } from "drizzle-kit";

          export default defineConfig({
            dialect: "sqlite",
            out: "./.cf03-drizzle",
            dbCredentials: {
              url: "./.cf03-introspect.sqlite",
            },
            introspect: {
              casing: "preserve",
            },
          });
          CONFIG
          rm -rf .cf03-drizzle
          npx --no-install drizzle-kit pull --config=drizzle.cf03.introspect.config.ts
          test -s .cf03-drizzle/schema.ts
          test -s .cf03-drizzle/relations.ts
          node scripts/cf03-normalize-drizzle-schema.mjs .cf03-drizzle/schema.ts
          cp .cf03-drizzle/schema.ts worker/db/schema.ts
          cp .cf03-drizzle/relations.ts worker/db/relations.ts
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          for (const path of ["worker/db/schema.ts", "worker/db/relations.ts"]) {
            const content = await readFile(path, "utf8");
            await writeFile(path, `${content.trimEnd()}\n`, "utf8");
          }
          NODE

      - name: Verify normalized schema
        run: |
          expected=$(sqlite3 .cf03-introspect.sqlite "SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%';")
          generated=$(grep -c 'sqliteTable(' worker/db/schema.ts)
          echo "Authoritative tables: $expected"
          echo "Normalized Drizzle tables: $generated"
          test "$expected" -eq "$generated"
          test "$(grep -c 'integer({ mode: "boolean" })' worker/db/schema.ts)" -eq 14
          git diff --check

      - name: Commit normalized mapping
        run: |
          git add worker/db/schema.ts worker/db/relations.ts
          if git diff --cached --quiet; then
            echo "Drizzle mapping is already normalized."
            exit 0
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "cf03: normalize Drizzle boolean columns"
          git push origin HEAD:phase/cf-03-native-stack
