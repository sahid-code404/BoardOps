name: CF03 Drizzle schema validation

on:
  push:
    branches:
      - phase/cf-03-native-stack
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cf03-drizzle-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare authoritative SQLite schema
        run: |
          command -v sqlite3 >/dev/null || { sudo apt-get update && sudo apt-get install -y sqlite3; }
          rm -f .cf03-introspect.sqlite
          while IFS= read -r migration; do
            echo "Applying ${migration}"
            sqlite3 .cf03-introspect.sqlite < "${migration}"
          done < <(find migrations -maxdepth 1 -type f -name '*.sql' -print | sort)

      - name: Install introspection-only SQLite driver
        run: npm install --no-save --no-package-lock better-sqlite3@^12.2.0 --no-audit --no-fund

      - name: Regenerate normalized Drizzle mapping in scratch space
        run: |
          cat > drizzle.cf03.introspect.config.ts <<'CONFIG'
          import { defineConfig } from "drizzle-kit";

          export default defineConfig({
            dialect: "sqlite",
            out: "./.cf03-drizzle",
            dbCredentials: {
              url: "./.cf03-introspect.sqlite",
            },
            introspect: {
              casing: "preserve",
            },
          });
          CONFIG
          rm -rf .cf03-drizzle
          npx --no-install drizzle-kit pull --config=drizzle.cf03.introspect.config.ts
          test -s .cf03-drizzle/schema.ts
          test -s .cf03-drizzle/relations.ts
          node scripts/cf03-normalize-drizzle-schema.mjs .cf03-drizzle/schema.ts
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          for (const path of [".cf03-drizzle/schema.ts", ".cf03-drizzle/relations.ts"]) {
            const content = await readFile(path, "utf8");
            await writeFile(path, `${content.trimEnd()}\n`, "utf8");
          }
          NODE

      - name: Verify schema coverage and drift
        run: |
          expected=$(sqlite3 .cf03-introspect.sqlite "SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%';")
          generated=$(grep -c 'sqliteTable(' .cf03-drizzle/schema.ts)
          committed=$(grep -c 'sqliteTable(' worker/db/schema.ts)
          booleans=$(grep -c 'integer({ mode: "boolean" })' worker/db/schema.ts)
          echo "Authoritative tables: $expected"
          echo "Generated Drizzle tables: $generated"
          echo "Committed Drizzle tables: $committed"
          echo "Canonical BOOLEAN columns: $booleans"
          test "$expected" -eq "$generated"
          test "$expected" -eq "$committed"
          test "$booleans" -eq 14
          diff -u worker/db/schema.ts .cf03-drizzle/schema.ts
          diff -u worker/db/relations.ts .cf03-drizzle/relations.ts
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const schema = await readFile("worker/db/schema.ts", "utf8");
          for (const table of ["User", "UserSession", "TrustedDevice", "LoginHistory", "AuditLog", "Bill", "MealConfiguration", "Setting"]) {
            if (!schema.includes(`sqliteTable("${table}"`) && !schema.includes(`sqliteTable('${table}'`)) {
              throw new Error(`Committed Drizzle schema is missing table ${table}`);
            }
          }
          NODE

      - name: Preserve drift diagnostics
        if: failure()
        run: |
          mkdir -p .cf03-drift-diagnostics
          if [ -f .cf03-drizzle/schema.ts ]; then
            cp .cf03-drizzle/schema.ts .cf03-drift-diagnostics/generated-schema.ts
            diff -u worker/db/schema.ts .cf03-drizzle/schema.ts > .cf03-drift-diagnostics/schema.diff || true
          fi
          if [ -f .cf03-drizzle/relations.ts ]; then
            cp .cf03-drizzle/relations.ts .cf03-drift-diagnostics/generated-relations.ts
            diff -u worker/db/relations.ts .cf03-drizzle/relations.ts > .cf03-drift-diagnostics/relations.diff || true
          fi

      - name: Upload drift diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cf03-drizzle-drift-${{ github.sha }}
          path: .cf03-drift-diagnostics/
          if-no-files-found: warn
          retention-days: 7
