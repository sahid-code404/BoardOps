name: Harden Cloudflare auth schema

on:
  push:
    branches:
      - phase/cf-01-runtime-foundation
    paths:
      - '.github/workflows/cf-auth-schema-hardening.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase/cf-01-runtime-foundation
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Repair Prisma auth schema and remove stale SMTP packages
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path

          schema = Path('prisma/schema.prisma')
          s = schema.read_text()
          s = s.replace('// Database schema (SQLite via Prisma)', '// Database schema (Cloudflare D1 / SQLite semantics via Prisma)')
          s = s.replace('generator client {\n  provider        = "prisma-client-js"\n  previewFeatures = ["driverAdapters"]\n}', 'generator client {\n  provider = "prisma-client-js"\n}')

          marker = '  twoFactorBackupCodes String?  // JSON array of hashed backup codes\n'
          fields = '''  twoFactorMethod String?       @default("EMAIL")\n  emailOtpCode String?\n  emailOtpExpiresAt DateTime?\n  emailOtpAttempts Int          @default(0)\n  otpPendingToken String?       @unique\n  otpPendingExpiresAt DateTime?\n'''
          if '  twoFactorMethod String?' not in s:
              if marker not in s:
                  raise SystemExit('User 2FA marker not found; refusing unsafe schema edit')
              s = s.replace(marker, marker + fields, 1)

          rel_marker = '  registrationRequests RegistrationRequest[]\n'
          if '  trustedDevices TrustedDevice[]' not in s:
              if rel_marker not in s:
                  raise SystemExit('User relation marker not found')
              s = s.replace(rel_marker, rel_marker + '  trustedDevices TrustedDevice[]\n', 1)

          session_end = '''model LoginHistory {\n'''
          trusted_model = '''model TrustedDevice {\n  id        String   @id @default(cuid())\n  userId    String\n  token     String   @unique\n  userAgent String?\n  ipAddress String?\n  expiresAt DateTime\n  createdAt DateTime @default(now())\n  user      User     @relation(fields: [userId], references: [id], onDelete: Cascade)\n\n  @@index([userId])\n  @@index([expiresAt])\n}\n\n'''
          if 'model TrustedDevice {' not in s:
              if session_end not in s:
                  raise SystemExit('LoginHistory marker not found')
              s = s.replace(session_end, trusted_model + session_end, 1)

          schema.write_text(s)

          pkg = Path('package.json')
          data = json.loads(pkg.read_text())
          for section in ('dependencies', 'devDependencies'):
              deps = data.get(section, {})
              deps.pop('nodemailer', None)
              deps.pop('@types/nodemailer', None)
          pkg.write_text(json.dumps(data, indent=2) + '\n')
          PY

          bun install
          bunx prisma format
          bunx prisma generate
          mkdir -p migrations
          bunx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script > migrations/0001_initial.sql
          test -s migrations/0001_initial.sql
          git diff --check
      - name: Commit hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json bun.lock prisma/schema.prisma migrations/0001_initial.sql
          git commit -m 'fix: align auth persistence with D1 runtime'
          git push origin HEAD:phase/cf-01-runtime-foundation
