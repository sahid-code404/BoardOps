name: Export finalized Node npm toolchain

on:
  push:
    branches:
      - phase/cf-01-runtime-foundation

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Apply validated source finalization
        run: |
          node scripts/finalize-node-toolchain.mjs
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";

          async function replaceExact(path, before, after) {
            const source = await readFile(path, "utf8");
            if (!source.includes(before)) throw new Error(`Expected source fragment missing in ${path}`);
            await writeFile(path, source.replace(before, after), "utf8");
          }

          for (const path of [
            ".github/workflows/cf-validate.yml",
            ".github/workflows/cf-deploy-production.yml",
          ]) {
            let source = await readFile(path, "utf8");
            source = source
              .replaceAll("actions/checkout@v4", "actions/checkout@v5")
              .replaceAll("actions/setup-node@v4", "actions/setup-node@v5")
              .replace(
                '          node-version: "22"\n',
                '          node-version: "22"\n          cache: "npm"\n'
              );
            await writeFile(path, source, "utf8");
          }

          await replaceExact(
            ".github/workflows/cf-validate.yml",
            `      - name: Install dependencies and generate npm lockfile\n        run: npm install --no-audit --no-fund\n\n      - name: Upload generated npm lockfile\n        uses: actions/upload-artifact@v4\n        with:\n          name: npm-lockfile\n          path: package-lock.json\n          if-no-files-found: error\n`,
            `      - name: Install dependencies\n        run: npm ci --no-audit --no-fund\n`
          );

          await replaceExact(
            ".github/workflows/cf-deploy-production.yml",
            `      - name: Install dependencies\n        run: npm install --no-audit --no-fund`,
            `      - name: Install dependencies\n        run: npm ci --no-audit --no-fund`
          );

          let readme = await readFile("README.md", "utf8");
          readme = readme
            .replace(
              "Node.js 22 and npm are used only for local development, build tooling, tests, and GitHub Actions. The project has no Bun runtime or Bun package-manager dependency.",
              "Node.js 22 and npm are the sole JavaScript toolchain for local development, build tooling, tests, and GitHub Actions. Production runs on Cloudflare workerd."
            )
            .replaceAll("npm install\n", "npm ci\n");
          await writeFile("README.md", readme, "utf8");

          let ignore = await readFile(".gitignore", "utf8");
          if (!ignore.includes("/.vinext/")) {
            ignore = ignore.replace("# Cloudflare / vinext local and build state\n", "# Cloudflare / vinext local and build state\n/.vinext/\n");
            await writeFile(".gitignore", ignore, "utf8");
          }
          NODE

      - name: Generate deterministic npm lockfile
        run: npm install --save-dev ajv@^8.20.0 --no-audit --no-fund

      - name: Prepare final source snapshot
        run: |
          git rm scripts/finalize-node-toolchain.mjs .github/workflows/finalize-node-toolchain.yml
          rm -rf .vinext dist .wrangler
          git add -A
          git diff --cached --check
          git diff --cached --name-status > finalization-manifest.txt
          git diff --cached --name-only --diff-filter=ACMRT > finalization-files.txt
          tar -czf finalization-source.tar.gz -T finalization-files.txt
          cat finalization-manifest.txt

      - name: Upload final source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: node-toolchain-final-source
          path: |
            finalization-source.tar.gz
            finalization-manifest.txt
          if-no-files-found: error
