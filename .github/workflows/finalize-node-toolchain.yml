name: Commit finalized Node npm source

on:
  push:
    branches:
      - phase/cf-01-runtime-foundation

permissions:
  contents: write

jobs:
  commit-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Apply validated source finalization
        run: |
          node scripts/finalize-node-toolchain.mjs
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";

          let readme = await readFile("README.md", "utf8");
          readme = readme
            .replace(
              "Node.js 22 and npm are used only for local development, build tooling, tests, and GitHub Actions. The project has no Bun runtime or Bun package-manager dependency.",
              "Node.js 22 and npm are the sole JavaScript toolchain for local development, build tooling, tests, and GitHub Actions. Production runs on Cloudflare workerd."
            )
            .replaceAll("npm install\n", "npm ci\n");
          await writeFile("README.md", readme, "utf8");

          let ignore = await readFile(".gitignore", "utf8");
          if (!ignore.includes("/.vinext/")) {
            ignore = ignore.replace("# Cloudflare / vinext local and build state\n", "# Cloudflare / vinext local and build state\n/.vinext/\n");
            await writeFile(".gitignore", ignore, "utf8");
          }
          NODE

      - name: Generate deterministic npm lockfile
        run: npm install --save-dev ajv@^8.20.0 --no-audit --no-fund

      - name: Prove clean npm install
        run: |
          rm -rf node_modules
          npm ci --no-audit --no-fund

      - name: Commit non-workflow source finalization
        run: |
          rm -rf .vinext dist .wrangler
          git rm scripts/finalize-node-toolchain.mjs
          git add .gitignore README.md package.json package-lock.json src
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: finalize Node npm source toolchain"
          git push origin HEAD:phase/cf-01-runtime-foundation
