name: Finalize Node npm toolchain

on:
  push:
    branches:
      - phase/cf-01-runtime-foundation

permissions:
  contents: write

concurrency:
  group: finalize-node-toolchain
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Apply React 19 cleanup
        run: node scripts/finalize-node-toolchain.mjs

      - name: Finalize npm workflows and docs
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";

          async function replaceExact(path, before, after) {
            const source = await readFile(path, "utf8");
            if (!source.includes(before)) {
              throw new Error(`Expected source fragment was not found in ${path}`);
            }
            await writeFile(path, source.replace(before, after), "utf8");
          }

          for (const path of [
            ".github/workflows/cf-validate.yml",
            ".github/workflows/cf-deploy-production.yml",
          ]) {
            let source = await readFile(path, "utf8");
            source = source
              .replaceAll("actions/checkout@v4", "actions/checkout@v5")
              .replaceAll("actions/setup-node@v4", "actions/setup-node@v5")
              .replace(
                '          node-version: "22"\n',
                '          node-version: "22"\n          cache: "npm"\n'
              );
            await writeFile(path, source, "utf8");
          }

          await replaceExact(
            ".github/workflows/cf-validate.yml",
            `      - name: Install dependencies and generate npm lockfile\n        run: npm install --no-audit --no-fund\n\n      - name: Upload generated npm lockfile\n        uses: actions/upload-artifact@v4\n        with:\n          name: npm-lockfile\n          path: package-lock.json\n          if-no-files-found: error\n`,
            `      - name: Install dependencies\n        run: npm ci --no-audit --no-fund\n`
          );

          await replaceExact(
            ".github/workflows/cf-deploy-production.yml",
            `      - name: Install dependencies\n        run: npm install --no-audit --no-fund`,
            `      - name: Install dependencies\n        run: npm ci --no-audit --no-fund`
          );

          let readme = await readFile("README.md", "utf8");
          readme = readme
            .replace(
              "Node.js 22 and npm are used only for local development, build tooling, tests, and GitHub Actions. The project has no Bun runtime or Bun package-manager dependency.",
              "Node.js 22 and npm are the sole JavaScript toolchain for local development, build tooling, tests, and GitHub Actions. Production runs on Cloudflare workerd."
            )
            .replaceAll("npm install\n", "npm ci\n");
          await writeFile("README.md", readme, "utf8");
          NODE

      - name: Resolve npm peer tree and generate lockfile
        run: npm install --save-dev ajv@^8.20.0 --no-audit --no-fund

      - name: Prove deterministic npm clean install
        run: |
          rm -rf node_modules
          npm ci --no-audit --no-fund

      - name: Remove one-time migration helpers
        run: git rm scripts/finalize-node-toolchain.mjs .github/workflows/finalize-node-toolchain.yml

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply D1 migrations locally
        run: npm run db:migrate:local

      - name: D1 schema smoke test
        run: |
          npm exec -- wrangler d1 execute boardops --local --command 'SELECT COUNT(*) AS users FROM "User";'
          npm exec -- wrangler d1 execute boardops --local --command 'SELECT COUNT(*) AS settings FROM "Setting";'
          npm exec -- wrangler d1 execute boardops --local --command 'SELECT COUNT(*) AS meals FROM "MealConfiguration";'
          npm exec -- wrangler d1 execute boardops --local --command 'SELECT COUNT(*) AS bills FROM "Bill";'

      - name: Regression tests
        run: npm test

      - name: Production TypeScript gate
        run: npm run typecheck

      - name: Zero-warning ESLint gate
        run: npm run lint:strict

      - name: Check vinext compatibility
        run: npm run cf:check

      - name: Build Cloudflare production bundle
        run: npm run build

      - name: Verify final repository cleanup
        run: |
          git diff --check
          if git grep -n -E 'bun:test|bunx|bun run|Bun\\.|bun\\.lock' -- package.json README.md scripts src vitest.config.ts; then
            echo "Legacy JavaScript toolchain reference detected"
            exit 1
          fi
          test -f package-lock.json
          test ! -e bun.lock

      - name: Commit finalized Node npm toolchain
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: finalize Node npm toolchain"
          git push origin HEAD:phase/cf-01-runtime-foundation
