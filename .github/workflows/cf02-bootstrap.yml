name: Bootstrap CF02 modular monolith

on:
  push:
    branches:
      - phase/cf-02-modular-monolith
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cf02-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: phase/cf-02-modular-monolith

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Resolve dependencies and lockfile
        run: bun install

      - name: Apply existing schema to local D1
        run: bunx wrangler d1 migrations apply boardops --local --config wrangler.modern.jsonc

      - name: Typecheck modern architecture
        run: bun run modern:typecheck

      - name: Build direct Vite Worker application
        run: bun run modern:build

      - name: Check diff whitespace
        run: git diff --check

      - name: Commit lockfile if dependency graph changed
        shell: bash
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "build: lock modular monolith dependencies"
          git push origin HEAD:phase/cf-02-modular-monolith
