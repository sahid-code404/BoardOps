name: Bootstrap BoardOps source baseline

on:
  push:
    paths:
      - '.github/workflows/bootstrap-from-board-ops.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: boardops-bootstrap
  cancel-in-progress: false

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Cloudflare target
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone pinned Board-Ops reference
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/sahid-code404/Board-Ops.git /tmp/board-ops-source
          git -C /tmp/board-ops-source checkout --detach 9dce04cf79b49c5938489fabc101a43eb36ea9f7

      - name: Import application source without runtime data or secrets
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='README.md' \
            --exclude='db/' \
            --exclude='backups/' \
            --exclude='logs/' \
            --exclude='upload/' \
            --exclude='public/uploads/' \
            --exclude='.zscripts/*.pid' \
            /tmp/board-ops-source/ ./

          printf '%s\n' '9dce04cf79b49c5938489fabc101a43eb36ea9f7' > UPSTREAM_BASE

          # Ensure forbidden runtime artifacts never survive an upstream copy.
          rm -f .env .env.local .env.production .env.development
          rm -rf db backups logs upload public/uploads

      - name: Commit imported baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to import.'
            exit 0
          fi
          git commit -m 'chore: import Board-Ops source baseline'
          git push origin HEAD:main
