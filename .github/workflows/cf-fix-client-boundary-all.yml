name: Repair all Cloudflare client/server boundaries

on:
  push:
    branches:
      - phase/cf-01-runtime-foundation
    paths:
      - '.github/workflows/cf-fix-client-boundary-all.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase/cf-01-runtime-foundation
          fetch-depth: 0
      - name: Redirect client-safe cleanup helpers
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(grep -RIl 'from "@/lib/user-cleanup"' src/components src/stores src/hooks 2>/dev/null || true)
          printf 'Client files importing user-cleanup before repair:\n%s\n' "${files[*]:-none}"
          for f in "${files[@]}"; do
            sed -i 's|from "@/lib/user-cleanup";|from "@/lib/deletion-utils";|' "$f"
          done
          if grep -RIn 'from "@/lib/user-cleanup"' src/components src/stores src/hooks 2>/dev/null; then
            echo 'A client-facing import of server cleanup code remains.' >&2
            exit 1
          fi
          git diff --check
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components src/stores src/hooks || true
          if git diff --cached --quiet; then
            echo 'No client-boundary edits required.'
            exit 0
          fi
          git commit -m 'refactor: isolate deletion helpers from server cleanup'
          git push origin HEAD:phase/cf-01-runtime-foundation
