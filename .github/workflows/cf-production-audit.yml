name: Audit Cloudflare production blockers

on:
  push:
    branches:
      - phase/cf-01-runtime-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cf-production-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Generate Prisma client
        run: bunx prisma generate
      - name: Audit Worker-incompatible local runtime assumptions
        shell: bash
        run: |
          echo '=== node/filesystem/process imports ==='
          grep -RInE 'from ["'\'' ]*(fs|fs/promises|child_process)["'\'']|require\(["'\''](fs|fs/promises|child_process)["'\'']\)' src --exclude='*.test.ts' --exclude='*.test.tsx' || true
          echo '=== hard-coded local paths / temp / cwd ==='
          grep -RInE '/home/z|/tmp/|process\.cwd\(\)|public/uploads|backup-db\.sh|sqlite3' src --exclude='*.test.ts' --exclude='*.test.tsx' || true
          echo '=== nodemailer references ==='
          grep -RIn 'nodemailer' src || true
      - name: Production TypeScript audit
        shell: bash
        run: |
          set -o pipefail
          bunx tsc --noEmit -p tsconfig.production.json 2>&1 | tee /tmp/tsc.txt || true
          echo '=== Production TypeScript error count ==='
          grep -c 'error TS' /tmp/tsc.txt || true
      - name: ESLint audit
        shell: bash
        run: |
          set -o pipefail
          bun run lint 2>&1 | tee /tmp/lint.txt || true
          echo '=== ESLint summary markers ==='
          tail -n 30 /tmp/lint.txt || true
