name: Repair Cloudflare client/server boundary

on:
  push:
    branches:
      - phase/cf-01-runtime-foundation
    paths:
      - '.github/workflows/cf-fix-client-boundary.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase/cf-01-runtime-foundation
          fetch-depth: 0
      - name: Move deletion countdown import to client-safe module
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's|from "@/lib/user-cleanup";|from "@/lib/deletion-utils";|' src/components/features/billing/billing-view.tsx
          grep -q 'from "@/lib/deletion-utils";' src/components/features/billing/billing-view.tsx
          git diff --check
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/features/billing/billing-view.tsx
          git commit -m 'refactor: keep billing client bundle server-free'
          git push origin HEAD:phase/cf-01-runtime-foundation
